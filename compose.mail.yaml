# Local demo infrastructure only; never relay mail to real recipients.
services:
  spring:
    # Startup and runner builds must use the same configured source worktree.
    build:
      context: ${SOURCE_REPO:-../aurelSpa-day35}
    environment:
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: '1025'
      SPRING_MAIL_USERNAME: demo@aurelspa.test
      SPRING_MAIL_PASSWORD: ''
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: 'false'
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: 'false'
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT: '5000'
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT: '5000'
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT: '5000'
    depends_on:
      mailpit:
        condition: service_healthy
  mailpit:
    image: axllent/mailpit:v1.31.6
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_MAX_MESSAGES: '100'
      MP_DISABLE_VERSION_CHECK: 'true'
    ports: ['127.0.0.1:8025:8025']
    networks: [internal, frontend]
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 3s
      retries: 10
